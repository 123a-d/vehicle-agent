<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vehicle Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .app {
            width: min(1100px, 94%);
            margin: 30px auto;
        }

        .header {
            background: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 18px;
            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 26px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 15px;
        }

        .session-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .session-id {
            background: #f0f2f5;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: monospace;
        }

        .main-grid {
            display: grid;
            grid-template-columns:
                320px
                1fr;
            gap: 18px;
        }

        .panel {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.08);
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .image-preview {
            width: 100%;
            min-height: 180px;
            border:
                2px dashed
                #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 14px;
            color: #888;
            text-align: center;
        }

        .image-preview img {
            width: 100%;
            display: block;
        }

        input[type="file"] {
            width: 100%;
            margin-bottom: 12px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
        }

        .primary-btn {
            background: #222;
            color: white;
        }

        .secondary-btn {
            background: #e8e8e8;
            color: #222;
        }

        .full-btn {
            width: 100%;
            margin-bottom: 10px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upload-status {
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
            white-space: pre-wrap;
            color: #555;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            height: 680px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 4px;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user {
            background: #e8f1ff;
            margin-left: 14%;
        }

        .message.assistant {
            background: #f0f0f0;
            margin-right: 14%;
        }

        .message.system {
            background: #fff5d9;
            font-size: 13px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            min-height: 70px;
            resize: vertical;
            border:
                1px solid
                #ccc;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
        }

        .send-btn {
            width: 90px;
        }

        @media (
            max-width: 800px
        ) {
            .main-grid {
                grid-template-columns:
                    1fr;
            }

            .chat-panel {
                height: 600px;
            }
        }

    </style>
</head>


<body>

<div class="app">

    <div class="header">

        <h1>
            🚗 Vehicle Agent
        </h1>

        <div class="subtitle">
            ResNet18 Visual Tool
            +
            DeepSeek Multi-Tool Agent
            +
            SQLite
        </div>

        <div class="session-row">

            <strong>
                当前 Session：
            </strong>

            <span
                id="sessionId"
                class="session-id"
            >
                正在创建...
            </span>

            <button
                id="newSessionButton"
                class="secondary-btn"
                onclick="createNewSession()"
            >
                新建会话
            </button>

        </div>

    </div>


    <div class="main-grid">

        <div class="panel">

            <h2>
                车辆图片
            </h2>

            <div
                id="imagePreview"
                class="image-preview"
            >
                暂未选择图片
            </div>

            <input
                id="imageInput"
                type="file"
                accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                onchange="previewImage()"
            >

            <button
                id="uploadButton"
                class="
                    primary-btn
                    full-btn
                "
                onclick="uploadImage()"
            >
                上传图片
            </button>

            <button
                id="recognizeButton"
                class="
                    secondary-btn
                    full-btn
                "
                onclick="recognizeUploadedImage()"
                disabled
            >
                识别 + 查询详情 + 保存
            </button>

            <div
                id="uploadStatus"
                class="upload-status"
            >
                图片尚未上传。
            </div>

        </div>


        <div class="
            panel
            chat-panel
        ">

            <h2>
                Agent 对话
            </h2>

            <div
                id="messages"
                class="messages"
            >

                <div class="
                    message
                    system
                ">
                    系统：正在初始化 Session...
                </div>

            </div>

            <div class="input-row">

                <textarea
                    id="messageInput"
                    placeholder="请输入问题，例如：我刚才识别的是什么车？"
                ></textarea>

                <button
                    id="sendButton"
                    class="
                        primary-btn
                        send-btn
                    "
                    onclick="sendMessage()"
                >
                    发送
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    // ========================================================
    // 1. 前端状态
    // ========================================================

    let currentSessionId = null;

    let uploadedImagePath = null;

    // Agent 正在执行时设为 true，
    // 防止用户连续点击造成重复请求。
    let agentBusy = false;


    // ========================================================
    // 2. 页面加载后自动创建 Session
    // ========================================================

    window.addEventListener(
        "DOMContentLoaded",
        async () => {

            await createNewSession();

        }
    );


    // ========================================================
    // 3. 创建新 Session
    // ========================================================

    async function createNewSession() {

        if (agentBusy) {
            return;
        }

        const newSessionButton =
            document.getElementById(
                "newSessionButton"
            );

        newSessionButton.disabled =
            true;

        try {

            const response = await fetch(
                "/sessions",
                {
                    method: "POST"
                }
            );

            const data =
                await safeJson(
                    response
                );

            if (!response.ok) {

                throw new Error(
                    getErrorMessage(
                        data,
                        "创建 Session 失败"
                    )
                );
            }

            currentSessionId =
                data.session_id;

            document
                .getElementById(
                    "sessionId"
                )
                .textContent =
                    currentSessionId;

            uploadedImagePath =
                null;

            document
                .getElementById(
                    "recognizeButton"
                )
                .disabled =
                    true;

            document
                .getElementById(
                    "uploadStatus"
                )
                .textContent =
                    "图片尚未上传。";

            document
                .getElementById(
                    "imageInput"
                )
                .value = "";

            document
                .getElementById(
                    "imagePreview"
                )
                .textContent =
                    "暂未选择图片";

            clearMessages();

            addMessage(
                "system",
                "新 Session 已创建："
                + currentSessionId
            );

        }

        catch (error) {

            addMessage(
                "system",
                "创建 Session 失败："
                + error.message
            );

        }

        finally {

            newSessionButton.disabled =
                false;
        }
    }


    // ========================================================
    // 4. 本地图片预览
    // ========================================================

    function previewImage() {

        const input =
            document.getElementById(
                "imageInput"
            );

        const preview =
            document.getElementById(
                "imagePreview"
            );

        const file =
            input.files[0];

        // 用户选了新图片以后，
        // 旧图片的服务器路径必须失效。
        uploadedImagePath =
            null;

        document
            .getElementById(
                "recognizeButton"
            )
            .disabled =
                true;

        document
            .getElementById(
                "uploadStatus"
            )
            .textContent =
                "图片尚未上传。";

        if (!file) {

            preview.textContent =
                "暂未选择图片";

            return;
        }

        const imageUrl =
            URL.createObjectURL(
                file
            );

        preview.innerHTML = "";

        const img =
            document.createElement(
                "img"
            );

        img.src =
            imageUrl;

        img.onload = () => {

            URL.revokeObjectURL(
                imageUrl
            );
        };

        preview.appendChild(
            img
        );
    }


    // ========================================================
    // 5. 上传图片
    // ========================================================

    async function uploadImage() {

        if (agentBusy) {
            return;
        }

        if (!currentSessionId) {

            alert(
                "Session 尚未创建。"
            );

            return;
        }

        const input =
            document.getElementById(
                "imageInput"
            );

        const file =
            input.files[0];

        if (!file) {

            alert(
                "请先选择一张图片。"
            );

            return;
        }

        const uploadButton =
            document.getElementById(
                "uploadButton"
            );

        uploadButton.disabled =
            true;

        uploadButton.textContent =
            "上传中...";

        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );

        try {

            const response =
                await fetch(

                    "/sessions/"
                    + encodeURIComponent(
                        currentSessionId
                    )
                    + "/upload-image",

                    {
                        method:
                            "POST",

                        body:
                            formData
                    }
                );

            const data =
                await safeJson(
                    response
                );

            if (!response.ok) {

                throw new Error(
                    getErrorMessage(
                        data,
                        "图片上传失败"
                    )
                );
            }

            uploadedImagePath =
                data.image_path;

            document
                .getElementById(
                    "uploadStatus"
                )
                .textContent =
                    "上传成功\n"
                    + "服务器路径：\n"
                    + uploadedImagePath;

            document
                .getElementById(
                    "recognizeButton"
                )
                .disabled =
                    false;

            addMessage(
                "system",
                "图片上传成功："
                + data.original_filename
            );

        }

        catch (error) {

            uploadedImagePath =
                null;

            document
                .getElementById(
                    "recognizeButton"
                )
                .disabled =
                    true;

            document
                .getElementById(
                    "uploadStatus"
                )
                .textContent =
                    "上传失败："
                    + error.message;

            addMessage(
                "system",
                "图片上传失败："
                + error.message
            );

        }

        finally {

            uploadButton.disabled =
                false;

            uploadButton.textContent =
                "上传图片";
        }
    }


    // ========================================================
    // 6. 一键识别
    // ========================================================

    async function recognizeUploadedImage() {

        if (agentBusy) {
            return;
        }

        if (!uploadedImagePath) {

            alert(
                "请先上传图片。"
            );

            return;
        }

        const message =

            "请识别这张车辆图片："
            + uploadedImagePath
            + "。"
            + "请查询详细车型信息，"
            + "并把本次识别结果保存到当前会话。";

        await sendChatRequest(
            message
        );
    }


    // ========================================================
    // 7. 普通聊天
    // ========================================================

    async function sendMessage() {

        if (agentBusy) {
            return;
        }

        const input =
            document.getElementById(
                "messageInput"
            );

        const message =
            input.value.trim();

        if (!message) {
            return;
        }

        input.value = "";

        await sendChatRequest(
            message
        );
    }


    // ========================================================
    // 8. 调用 /chat
    // ========================================================

    async function sendChatRequest(
        message
    ) {

        if (agentBusy) {
            return;
        }

        if (!currentSessionId) {

            alert(
                "Session 尚未创建。"
            );

            return;
        }

        agentBusy =
            true;

        addMessage(
            "user",
            message
        );

        const sendButton =
            document.getElementById(
                "sendButton"
            );

        const recognizeButton =
            document.getElementById(
                "recognizeButton"
            );

        const uploadButton =
            document.getElementById(
                "uploadButton"
            );

        const newSessionButton =
            document.getElementById(
                "newSessionButton"
            );

        sendButton.disabled =
            true;

        recognizeButton.disabled =
            true;

        uploadButton.disabled =
            true;

        newSessionButton.disabled =
            true;

        addMessage(
            "system",
            "Agent 正在处理..."
        );

        try {

            const response =
                await fetch(
                    "/chat",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                {
                                    session_id:
                                        currentSessionId,

                                    message:
                                        message
                                }
                            )
                    }
                );

            const data =
                await safeJson(
                    response
                );

            removeLastProcessingMessage();

            if (!response.ok) {

                throw new Error(
                    getErrorMessage(
                        data,
                        "Agent 请求失败"
                    )
                );
            }

            addMessage(
                "assistant",
                data.answer
            );

        }

        catch (error) {

            removeLastProcessingMessage();

            addMessage(
                "system",
                "请求失败："
                + error.message
            );

        }

        finally {

            agentBusy =
                false;

            sendButton.disabled =
                false;

            uploadButton.disabled =
                false;

            newSessionButton.disabled =
                false;

            recognizeButton.disabled =
                !uploadedImagePath;
        }
    }


    // ========================================================
    // 9. 安全解析 JSON
    // ========================================================

    async function safeJson(
        response
    ) {

        try {

            return await response.json();

        }

        catch {

            return {};
        }
    }


    // ========================================================
    // 10. 统一提取后端错误信息
    // ========================================================

    function getErrorMessage(
        data,
        fallback
    ) {

        if (
            data
            &&
            typeof data.detail === "string"
        ) {

            return data.detail;
        }

        if (
            data
            &&
            data.detail
        ) {

            return JSON.stringify(
                data.detail
            );
        }

        return fallback;
    }


    // ========================================================
    // 11. 添加聊天消息
    // ========================================================

    function addMessage(
        role,
        text
    ) {

        const messages =
            document.getElementById(
                "messages"
            );

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "message "
            + role;

        // 使用 textContent，
        // 避免模型输出被当成 HTML 执行。
        div.textContent =
            text;

        messages.appendChild(
            div
        );

        messages.scrollTop =
            messages.scrollHeight;
    }


    // ========================================================
    // 12. 清空消息
    // ========================================================

    function clearMessages() {

        document
            .getElementById(
                "messages"
            )
            .innerHTML = "";
    }


    // ========================================================
    // 13. 删除“Agent 正在处理...”
    // ========================================================

    function removeLastProcessingMessage() {

        const messages =
            document.getElementById(
                "messages"
            );

        const systemMessages =
            messages.querySelectorAll(
                ".message.system"
            );

        if (
            systemMessages.length <= 0
        ) {
            return;
        }

        const last =
            systemMessages[
                systemMessages.length - 1
            ];

        if (
            last.textContent
                .includes(
                    "Agent 正在处理"
                )
        ) {

            last.remove();
        }
    }


    // ========================================================
    // 14. Enter发送 / Shift+Enter换行
    // ========================================================

    document
        .getElementById(
            "messageInput"
        )
        .addEventListener(
            "keydown",
            async function(event) {

                if (
                    event.key === "Enter"
                    &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    await sendMessage();
                }
            }
        );

</script>

</body>
</html>
